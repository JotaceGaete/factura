services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: facturaapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facturaapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-facturaapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrate.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facturaapp} -d ${POSTGRES_DB:-facturaapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Hono API) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facturaapp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-facturaapp}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-facturaapp}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    expose:
      - "3001"

  # ─── Frontend (React + Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: facturaapp-frontend
    restart: unless-stopped
    environment:
      SERVICE_FQDN_FRONTEND: "https://factura.jotace.uk"
    depends_on:
      - backend
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
